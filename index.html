  <div id="toast" class="toast hidden" role="status"></div>

  <script src="./app.js?v=20260815-beauty-v1-3"></script>
  <script>
    (() => {
      'use strict';

      const DATA_KEY = 'ichigo-v1-data';
      const SETTINGS_KEY = 'ichigo-v1-settings';
      const BULK_BACKUP_KEY = 'ichigo-v1-bulk-link-backup';
      const AUTO_MATCH_THRESHOLD = 0.56;
      const BULK_MATCH_THRESHOLD = 0.62;
      const BULK_SEARCH_DELAY = 6300;
      let bypassAutoLookup = false;
      let bulkStopRequested = false;
      let bulkRunning = false;
      let lastOpenedProductId = '';

      const norm = value => String(value || '').toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g, ' ').trim();
      const tokens = value => new Set(norm(value).split(/\s+/).filter(Boolean));
      const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
      const similarity = (a, b) => {
        const A = tokens(a), B = tokens(b);
        if (!A.size || !B.size) return 0;
        let common = 0;
        A.forEach(token => { if (B.has(token)) common += 1; });
        return common / Math.max(A.size, B.size);
      };
      const onlineEnabled = () => {
        try {
          const saved = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}');
          return saved.onlineSearch !== false;
        } catch (_) {
          return true;
        }
      };
      const webSearchUrl = query => 'https://www.google.com/search?q=' + encodeURIComponent(query + ' skincare makeup product');
      const scoreMatch = (name, brand, product) => {
        const remoteName = product.product_name || product.generic_name || '';
        const remoteBrand = product.brands || '';
        const localName = norm(name), candidateName = norm(remoteName);
        let score = similarity(name, remoteName) * 0.72;
        if (localName && candidateName && localName === candidateName) score += 0.22;
        else if (localName && candidateName && (localName.includes(candidateName) || candidateName.includes(localName))) score += 0.12;
        if (brand && remoteBrand) score += similarity(brand, remoteBrand) * 0.18;
        return Math.min(1, score);
      };
      const inferCategory = text => {
        const rules = [
          ['Sunscreen', /\bspf\b|\bsunscreen\b|\bsun screen\b|\buv\b/i],
          ['First Cleanse', /\bcleansing oil\b|\bcleansing balm\b|\bmicellar\b/i],
          ['Cleanser', /\bcleanser\b|\bcleansing foam\b|\bface wash\b|\bcreamy foam\b/i],
          ['Toner', /\btoner\b/i], ['Essence', /\bessence\b/i], ['Ampoule', /\bampoule\b/i],
          ['Serum', /\bserum\b/i], ['Eye Care', /\beye cream\b|\beye serum\b/i],
          ['Moisturizer', /\bmoistur|\bface cream\b/i], ['Spot Treatment', /\bspot\b|\bacne cream\b/i],
          ['Lip Tint', /\blip tint\b|\btint\b/i], ['Lipstick', /\blipstick\b/i],
          ['Foundation', /\bfoundation\b/i], ['Concealer', /\bconcealer\b/i], ['Blush', /\bblush\b/i],
          ['Mascara', /\bmascara\b/i], ['Eyeliner', /\beyeliner\b/i]
        ];
        return rules.find(([, rule]) => rule.test(text))?.[0] || '';
      };
      const inferTags = text => {
        const rules = [
          ['Tretinoin', /\btretinoin\b/i], ['Retinal', /\bretinal\b/i], ['Retinol', /\bretinol\b/i],
          ['Benzoyl Peroxide', /\bbenzoyl peroxide\b/i], ['Azelaic Acid', /\bazelaic\b/i],
          ['Salicylic Acid / BHA', /\bsalicylic\b|\bbha\b/i], ['AHA', /\baha\b|\bglycolic\b|\blactic acid\b|\bmandelic\b/i],
          ['Vitamin C', /\bvitamin c\b|\bascorb/i], ['Niacinamide', /\bniacinamide\b/i], ['Alpha Arbutin', /\barbutin\b/i],
          ['PDRN', /\bpdrn\b/i], ['Peptides', /\bpeptide\b/i], ['Ceramides', /\bceramide\b/i],
          ['Beta-Glucan', /\bbeta[- ]?glucan\b/i], ['Tea Tree', /\btea tree\b/i], ['Collagen', /\bcollagen\b/i]
        ];
        return rules.filter(([, rule]) => rule.test(text)).map(([label]) => label);
      };
      const setIfEmpty = (selector, value) => {
        const el = document.querySelector(selector);
        if (el && !el.value && value) el.value = value;
      };
      const readData = () => {
        try {
          const parsed = JSON.parse(localStorage.getItem(DATA_KEY) || '{}');
          return parsed && Array.isArray(parsed.products) ? parsed : null;
        } catch (_) {
          return null;
        }
      };
      const writeData = value => localStorage.setItem(DATA_KEY, JSON.stringify(value));
      const fmtLinkedDate = value => {
        if (!value) return '';
        try { return new Date(value).toLocaleDateString(undefined, { year:'numeric', month:'short', day:'numeric' }); }
        catch (_) { return ''; }
      };
      const escHtml = value => String(value ?? '').replace(/[&<>"']/g, char => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
      }[char]));

      async function fetchOnlineCandidates(query, pageSize = 8) {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 8500);
        try {
          const fields = [
            'code','product_name','generic_name','brands','quantity','categories',
            'image_front_url','image_front_small_url','ingredients_text','ingredients_text_en'
          ].join(',');
          const url = 'https://world.openbeautyfacts.org/cgi/search.pl?search_terms=' + encodeURIComponent(query) +
            '&search_simple=1&action=process&json=1&page_size=' + pageSize + '&fields=' + encodeURIComponent(fields);
          const response = await fetch(url, { signal: controller.signal, headers: { Accept: 'application/json' } });
          if (response.status === 429) {
            const error = new Error('rate limited');
            error.code = 429;
            throw error;
          }
          if (!response.ok) throw new Error('lookup failed');
          const json = await response.json();
          return (json.products || []).filter(p => p.product_name || p.generic_name);
        } finally {
          clearTimeout(timeout);
        }
      }

      async function findBestOnlineProduct(query, name, brand) {
        const matches = await fetchOnlineCandidates(query, 8);
        return matches
          .map(product => ({ product, score: scoreMatch(name, brand, product) }))
          .sort((a, b) => b.score - a.score)[0] || null;
      }

      function applyProductMatch(match) {
        const p = match.product;
        const source = p.code ? 'https://world.openbeautyfacts.org/product/' + encodeURIComponent(p.code) : '';
        setIfEmpty('#fBrand', p.brands || '');
        setIfEmpty('#fSize', p.quantity || '');
        setIfEmpty('#fBarcode', p.code || '');
        const ingredients = p.ingredients_text || p.ingredients_text_en || '';
        setIfEmpty('#fIngredients', ingredients);
        const category = inferCategory([p.product_name, p.generic_name, p.categories].filter(Boolean).join(' '));
        const categoryEl = document.querySelector('#fCategory');
        if (categoryEl && category && categoryEl.value === 'Other' && [...categoryEl.options].some(o => o.value === category)) {
          categoryEl.value = category;
        }
        const tagEl = document.querySelector('#fTags');
        if (tagEl) {
          const existing = tagEl.value.split(',').map(x => x.trim()).filter(Boolean);
          const detected = inferTags([p.product_name, ingredients].filter(Boolean).join(' '));
          tagEl.value = [...new Set([...existing, ...detected])].join(', ');
        }
        return source;
      }

      function enrichStoredProduct(product, match) {
        const remote = match.product;
        const ingredients = remote.ingredients_text || remote.ingredients_text_en || '';
        const source = remote.code ? 'https://world.openbeautyfacts.org/product/' + encodeURIComponent(remote.code) : '';
        if (!product.brand && remote.brands) product.brand = remote.brands;
        if (!product.size && remote.quantity) product.size = remote.quantity;
        if (!product.barcode && remote.code) product.barcode = remote.code;
        if (!product.ingredients && ingredients) product.ingredients = ingredients;
        if (!product.image) product.image = remote.image_front_url || remote.image_front_small_url || '';
        if (!product.category || product.category === 'Other') {
          const category = inferCategory([remote.product_name, remote.generic_name, remote.categories].filter(Boolean).join(' '));
          if (category) product.category = category;
        }
        product.tags = [...new Set([
          ...(Array.isArray(product.tags) ? product.tags : []),
          ...inferTags([remote.product_name, ingredients].filter(Boolean).join(' '))
        ])];
        product.sourceUrl = source || webSearchUrl([product.brand, product.name].filter(Boolean).join(' '));
        product.sourceName = source ? 'Open Beauty Facts' : 'Web Search';
        product.onlineMatchScore = Number(match.score.toFixed(3));
        product.onlineMatchStatus = source ? 'structured' : 'search-link';
        product.onlineLinkedAt = Date.now();
        product.onlineProductName = remote.product_name || '';
        product.onlineGenericName = remote.generic_name || '';
        product.onlineBrand = remote.brands || '';
        product.onlineQuantity = remote.quantity || '';
        product.onlineCategories = remote.categories || '';
        product.onlineImage = remote.image_front_url || remote.image_front_small_url || '';
        product.updatedAt = Date.now();
      }

      function attachSearchFallback(product) {
        const query = [product.brand, product.name].filter(Boolean).join(' ').trim() || product.name || '';
        product.sourceUrl = webSearchUrl(query);
        product.sourceName = 'Web Search';
        product.onlineMatchStatus = 'search-link';
        product.onlineMatchScore = null;
        product.onlineLinkedAt = Date.now();
        product.updatedAt = Date.now();
      }

      function openBulkSheet(total) {
        const backdrop = document.getElementById('sheetBackdrop');
        const sheet = document.getElementById('sheet');
        const content = document.getElementById('sheetContent');
        if (!backdrop || !sheet || !content) return false;
        content.innerHTML = `
          <div class="sheet-title"><div><h2>Link Stash Online</h2><p>Ichigo will match products without confirmed online details, one at a time.</p></div><button class="icon-button" id="bulkCloseBtn" aria-label="Close">×</button></div>
          <div class="notice">Ichigo spaces out searches to stay within the beauty database search limit. ${total > 1 ? 'A larger stash can take a few minutes.' : ''} Your products are saved after each result, so stopping is safe.</div>
          <div class="card" style="margin-top:12px">
            <div class="section-head"><h3 id="bulkStatus">Ready to match ${total} product${total === 1 ? '' : 's'}</h3><strong id="bulkCounter">0 / ${total}</strong></div>
            <div class="bar" style="margin-top:10px"><i id="bulkProgress" style="width:0%"></i></div>
            <p id="bulkCurrent" style="margin-top:10px">Preparing your stash…</p>
          </div>
          <div class="button-row" style="margin-top:14px"><button class="secondary" id="bulkStopBtn">Stop safely</button></div>`;
        backdrop.classList.remove('hidden');
        sheet.classList.remove('hidden');
        sheet.setAttribute('aria-label', 'Link Stash Online');
        document.getElementById('bulkCloseBtn')?.addEventListener('click', () => {
          if (bulkRunning) bulkStopRequested = true;
          else closeBulkSheet();
        });
        document.getElementById('bulkStopBtn')?.addEventListener('click', () => {
          bulkStopRequested = true;
          const b = document.getElementById('bulkStopBtn');
          if (b) { b.disabled = true; b.textContent = 'Stopping…'; }
        });
        return true;
      }

      function closeBulkSheet() {
        document.getElementById('sheetBackdrop')?.classList.add('hidden');
        document.getElementById('sheet')?.classList.add('hidden');
      }

      function updateBulkProgress(done, total, text) {
        const counter = document.getElementById('bulkCounter');
        const progress = document.getElementById('bulkProgress');
        const current = document.getElementById('bulkCurrent');
        if (counter) counter.textContent = `${done} / ${total}`;
        if (progress) progress.style.width = `${total ? Math.round(done / total * 100) : 100}%`;
        if (current) current.textContent = text;
      }

      function finishBulkSheet(summary, stopped = false) {
        bulkRunning = false;
        const status = document.getElementById('bulkStatus');
        const current = document.getElementById('bulkCurrent');
        const buttons = document.querySelector('#sheetContent .button-row');
        if (status) status.textContent = stopped ? 'Stopped safely' : 'Online linking complete';
        if (current) {
          current.textContent = `${summary.structured} product${summary.structured === 1 ? '' : 's'} now have structured online details · ${summary.fallback} have web references${summary.failed ? ` · ${summary.failed} could not be updated` : ''}.`;
        }
        if (buttons) {
          buttons.innerHTML = '<button class="primary" id="bulkReloadBtn">Refresh Stash</button><button class="secondary" id="bulkUndoBtn">Undo this bulk link</button>';
        }
        document.getElementById('bulkReloadBtn')?.addEventListener('click', () => location.reload());
        document.getElementById('bulkUndoBtn')?.addEventListener('click', undoBulkLink);
        syncVisibleStashOnlineState();
      }

      function undoBulkLink() {
        try {
          const backup = JSON.parse(localStorage.getItem(BULK_BACKUP_KEY) || 'null');
          if (!backup?.data) return alert('No bulk-link backup is available.');
          localStorage.setItem(DATA_KEY, backup.data);
          location.reload();
        } catch (_) {
          alert('Ichigo could not restore the bulk-link backup.');
        }
      }

      async function startBulkLink() {
        if (bulkRunning) return;
        if (!onlineEnabled()) return alert('Online Smart Search is turned off. Turn it on in Settings first.');
        if (!navigator.onLine) return alert('Connect to the internet before linking your stash.');

        const db = readData();
        if (!db) return alert('Ichigo could not read your local stash. Your data was not changed.');
        const candidates = db.products.filter(product =>
          product && product.name &&
          !['Wishlist', 'Archived'].includes(product.status) &&
          (!String(product.sourceUrl || '').trim() || product.onlineMatchStatus === 'search-link')
        );
        if (!candidates.length) return alert('Everything in your current stash already has structured online details.');

        const original = localStorage.getItem(DATA_KEY);
        localStorage.setItem(BULK_BACKUP_KEY, JSON.stringify({ savedAt: Date.now(), data: original }));
        document.getElementById('closeDrawerBtn')?.click();
        if (!openBulkSheet(candidates.length)) return;

        bulkRunning = true;
        bulkStopRequested = false;
        const summary = { structured: 0, fallback: 0, failed: 0 };

        for (let i = 0; i < candidates.length; i += 1) {
          if (bulkStopRequested) break;
          const product = candidates[i];
          updateBulkProgress(i, candidates.length, `Searching ${product.name}…`);
          const query = [product.brand, product.name].filter(Boolean).join(' ').trim() || product.name;

          try {
            let best;
            try {
              best = await findBestOnlineProduct(query, product.name, product.brand || '');
            } catch (error) {
              if (error?.code === 429) {
                updateBulkProgress(i, candidates.length, 'The product database asked Ichigo to slow down. Waiting before retrying…');
                await wait(65000);
                if (bulkStopRequested) break;
                best = await findBestOnlineProduct(query, product.name, product.brand || '');
              } else {
                throw error;
              }
            }

            if (best && best.score >= BULK_MATCH_THRESHOLD) {
              enrichStoredProduct(product, best);
              summary.structured += 1;
            } else {
              attachSearchFallback(product);
              summary.fallback += 1;
            }
            writeData(db);
          } catch (_) {
            attachSearchFallback(product);
            try {
              writeData(db);
              summary.fallback += 1;
            } catch (_) {
              summary.failed += 1;
            }
          }

          updateBulkProgress(i + 1, candidates.length, `Updated ${product.name}`);
          syncVisibleStashOnlineState();
          if (i < candidates.length - 1 && !bulkStopRequested) await wait(BULK_SEARCH_DELAY);
        }

        finishBulkSheet(summary, bulkStopRequested);
      }

      function openExistingMatchPicker(product) {
        const backdrop = document.getElementById('sheetBackdrop');
        const sheet = document.getElementById('sheet');
        const content = document.getElementById('sheetContent');
        if (!backdrop || !sheet || !content || !product) return;
        const defaultQuery = [product.brand, product.name].filter(Boolean).join(' ').trim() || product.name;
        content.innerHTML = `
          <div class="sheet-title">
            <div><span class="eyebrow">ONLINE MATCH</span><h2>Find the exact product</h2><p>Choose the product that actually matches your ${escHtml(product.name)} entry. Ichigo will update this Stash item instead of creating a duplicate.</p></div>
            <button class="icon-button" id="existingMatchClose" aria-label="Close">×</button>
          </div>
          <div class="searchbar">
            <input id="existingMatchQuery" value="${escHtml(defaultQuery)}" placeholder="Search product name">
            <button class="primary" id="existingMatchSearch">Search</button>
          </div>
          <div class="notice">Selecting a result only fills missing online information. Your own status, dates, quantity, notes, and other personal inventory data stay yours.</div>
          <div id="existingMatchResults" style="margin-top:12px"></div>`;
        backdrop.classList.remove('hidden');
        sheet.classList.remove('hidden');
        sheet.setAttribute('aria-label', 'Find exact online product');
        document.getElementById('existingMatchClose')?.addEventListener('click', closeBulkSheet);
        document.getElementById('existingMatchSearch')?.addEventListener('click', () => runExistingMatchSearch(product));
        document.getElementById('existingMatchQuery')?.addEventListener('keydown', event => {
          if (event.key === 'Enter') runExistingMatchSearch(product);
        });
        runExistingMatchSearch(product);
      }

      async function runExistingMatchSearch(product) {
        const box = document.getElementById('existingMatchResults');
        const input = document.getElementById('existingMatchQuery');
        const query = input?.value.trim() || '';
        if (!box || !query) return;
        box.innerHTML = '<div class="empty"><p>Searching online product records…</p></div>';
        try {
          const candidates = await fetchOnlineCandidates(query, 12);
          if (!candidates.length) {
            box.innerHTML = `<div class="empty"><div class="empty-icon">🌐</div><h3>No structured product record found</h3><p>You can still search the wider web, or try a shorter brand + product name.</p><button class="primary" id="existingMatchWeb">Search wider web</button></div>`;
            document.getElementById('existingMatchWeb')?.addEventListener('click', () => window.open(webSearchUrl(query), '_blank', 'noopener'));
            return;
          }
          const ranked = candidates
            .map(candidate => ({ candidate, score: scoreMatch(product.name, product.brand || '', candidate) }))
            .sort((a, b) => b.score - a.score);

          box.innerHTML = ranked.map((entry, index) => {
            const candidate = entry.candidate;
            const image = candidate.image_front_small_url || candidate.image_front_url || '';
            const name = candidate.product_name || candidate.generic_name || 'Unnamed product';
            return `<article class="result-card">
              <div>${image ? `<img src="${escHtml(image)}" alt="">` : '<div class="product-thumb">🧴</div>'}</div>
              <div>
                <h4>${escHtml(name)}</h4>
                <p>${escHtml(candidate.brands || '')}${candidate.quantity ? ' · ' + escHtml(candidate.quantity) : ''}</p>
                <div class="badges">
                  <span class="badge lav">Open Beauty Facts</span>
                  <span class="badge gray">${Math.round(entry.score * 100)}% name match</span>
                </div>
                <div class="button-row" style="margin-top:8px">
                  <button class="primary" data-confirm-existing-match="${index}">Use this match</button>
                  ${candidate.code ? `<button class="secondary" data-preview-existing-match="${index}">View source</button>` : ''}
                </div>
              </div>
            </article>`;
          }).join('') + '<button class="link-btn" id="existingMatchWeb">Still not here? Search the wider web →</button>';

          document.querySelectorAll('[data-confirm-existing-match]').forEach(button => {
            button.addEventListener('click', () => {
              const entry = ranked[Number(button.dataset.confirmExistingMatch)];
              const db = readData();
              const stored = db?.products.find(item => String(item.id) === String(product.id));
              if (!db || !stored || !entry) return;
              enrichStoredProduct(stored, { product: entry.candidate, score: entry.score });
              writeData(db);
              location.reload();
            });
          });
          document.querySelectorAll('[data-preview-existing-match]').forEach(button => {
            button.addEventListener('click', () => {
              const candidate = ranked[Number(button.dataset.previewExistingMatch)]?.candidate;
              if (candidate?.code) window.open('https://world.openbeautyfacts.org/product/' + encodeURIComponent(candidate.code), '_blank', 'noopener');
            });
          });
          document.getElementById('existingMatchWeb')?.addEventListener('click', () => window.open(webSearchUrl(query), '_blank', 'noopener'));
        } catch (_) {
          box.innerHTML = `<div class="empty"><div class="empty-icon">🌐</div><h3>Online lookup is unavailable right now</h3><p>Nothing in your Stash was changed. Try again, or open a wider web search.</p><button class="primary" id="existingMatchWeb">Search wider web</button></div>`;
          document.getElementById('existingMatchWeb')?.addEventListener('click', () => window.open(webSearchUrl(query), '_blank', 'noopener'));
        }
      }

      function addBulkLinkButtonToStash() {
        const main = document.getElementById('main');
        if (!main || document.getElementById('bulkLinkStashBtn')) return;
        const heading = [...main.querySelectorAll('h1')].find(el => el.textContent.trim() === 'My Stash');
        if (!heading) return;
        const searchbar = main.querySelector('.searchbar');
        if (!searchbar) return;
        const button = document.createElement('button');
        button.type = 'button';
        button.id = 'bulkLinkStashBtn';
        button.className = 'secondary';
        button.textContent = 'Link all online';
        button.addEventListener('click', startBulkLink);
        searchbar.appendChild(button);
      }

      function syncVisibleStashOnlineState() {
        const db = readData();
        if (!db) return;
        const byId = new Map(db.products.map(product => [String(product.id), product]));
        document.querySelectorAll('[data-product]').forEach(card => {
          const product = byId.get(String(card.dataset.product));
          if (!product) return;
          const thumb = card.querySelector('.product-thumb');
          if (thumb && product.image && !thumb.querySelector('img')) {
            thumb.innerHTML = `<img src="${escHtml(product.image)}" alt="">`;
          }
          const badges = card.querySelector('.badges');
          if (!badges) return;
          const old = badges.querySelector('.ichigo-online-badge');
          if (old) old.remove();
          if (!product.sourceUrl) return;
          const badge = document.createElement('span');
          badge.className = product.onlineMatchStatus === 'structured' ? 'badge lav ichigo-online-badge' : 'badge gray ichigo-online-badge';
          badge.textContent = product.onlineMatchStatus === 'structured' ? 'Online details' : 'Web reference';
          badges.appendChild(badge);
        });
      }

      function findDetailProduct() {
        const db = readData();
        if (!db) return null;
        if (lastOpenedProductId) {
          const direct = db.products.find(product => String(product.id) === String(lastOpenedProductId));
          if (direct) return direct;
        }
        const sheet = document.getElementById('sheetContent');
        const name = sheet?.querySelector('.sheet-title h2')?.textContent?.trim();
        const brand = sheet?.querySelector('.sheet-title .eyebrow')?.textContent?.trim();
        if (!name) return null;
        return db.products.find(product =>
          norm(product.name) === norm(name) &&
          (!brand || brand === 'Beauty item' || !product.brand || norm(product.brand) === norm(brand))
        ) || db.products.find(product => norm(product.name) === norm(name)) || null;
      }

      function onlineDetailHtml(product) {
        if (!product) return '';
        const isStructured = product.onlineMatchStatus === 'structured' || product.sourceName === 'Open Beauty Facts';
        const source = product.sourceName || (isStructured ? 'Open Beauty Facts' : 'Web reference');
        const linked = fmtLinkedDate(product.onlineLinkedAt);
        const confidence = Number.isFinite(Number(product.onlineMatchScore))
          ? Math.round(Number(product.onlineMatchScore) * 100) + '% match'
          : '';
        const image = product.onlineImage || product.image || '';
        const remoteName = product.onlineProductName || product.name;
        const remoteBrand = product.onlineBrand || product.brand || '';
        const whatItIs = product.onlineGenericName || product.onlineCategories || product.category || '';
        const quantity = product.onlineQuantity || product.size || '';
        const ingredients = product.ingredients || '';
        const tags = Array.isArray(product.tags) ? product.tags : [];
        const sourceUrl = product.sourceUrl || webSearchUrl([product.brand, product.name].filter(Boolean).join(' '));

        if (!isStructured) {
          return `
            <section id="ichigoOnlineDetailPanel" class="section">
              <div class="section-head"><h2>Online reference</h2><span class="badge gray">Needs exact match</span></div>
              <div class="card">
                <div style="display:flex;gap:12px;align-items:flex-start">
                  <div style="font-size:28px;line-height:1">🌐</div>
                  <div style="min-width:0">
                    <strong>Ichigo found a web reference, but not a confirmed product record yet.</strong>
                    <p style="margin-top:6px">The link is useful for searching the product online, but Ichigo has not imported a verified image, size, ingredient list, or product description from a structured source.</p>
                    ${linked ? `<p class="meta" style="margin-top:8px">Linked ${escHtml(linked)}</p>` : ''}
                  </div>
                </div>
                <div class="button-row" style="margin-top:12px">
                  <button class="secondary" id="ichigoOpenOnlineRef">Open web search</button>
                  <button class="primary" id="ichigoFindExactMatch">Find exact match</button>
                </div>
              </div>
            </section>`;
        }

        return `
          <section id="ichigoOnlineDetailPanel" class="section">
            <div class="section-head"><h2>Online product info</h2><span class="badge lav">Connected</span></div>
            <div class="card">
              <div style="display:flex;gap:14px;align-items:flex-start">
                ${image ? `<div class="product-thumb" style="width:88px;height:88px;flex:0 0 88px"><img src="${escHtml(image)}" alt=""></div>` : ''}
                <div style="min-width:0;flex:1">
                  <span class="eyebrow">${escHtml(source)}</span>
                  <h3 style="margin-top:4px">${escHtml(remoteName)}</h3>
                  <p style="margin-top:4px">${[remoteBrand, quantity].filter(Boolean).map(escHtml).join(' · ') || 'Product details from online source'}</p>
                  <div class="badges" style="margin-top:8px">
                    ${confidence ? `<span class="badge lav">${escHtml(confidence)}</span>` : ''}
                    ${linked ? `<span class="badge gray">Linked ${escHtml(linked)}</span>` : ''}
                  </div>
                </div>
              </div>

              ${whatItIs ? `
                <div style="margin-top:14px">
                  <strong>What it is</strong>
                  <p style="margin-top:4px">${escHtml(whatItIs)}</p>
                </div>` : ''}

              ${tags.length ? `
                <div style="margin-top:14px">
                  <strong>Key ingredients / actives</strong>
                  <div class="badges" style="margin-top:7px">${tags.map(tag => `<span class="badge">${escHtml(tag)}</span>`).join('')}</div>
                </div>` : ''}

              ${ingredients ? `
                <details style="margin-top:14px">
                  <summary style="font-weight:700;cursor:pointer">Ingredient list</summary>
                  <p style="margin-top:8px;word-break:break-word">${escHtml(ingredients)}</p>
                </details>` : `
                <div class="notice" style="margin-top:14px">This online record does not include a full ingredient list yet.</div>`}

              <div class="button-row" style="margin-top:14px">
                <button class="primary" id="ichigoViewStructuredSource">View source</button>
                <button class="secondary" id="ichigoRefreshStructuredMatch">Refresh match</button>
                <button class="secondary" id="ichigoSearchWiderWeb">Search wider web</button>
              </div>
            </div>
          </section>`;
      }

      function decorateProductDetail() {
        const sheet = document.getElementById('sheetContent');
        if (!sheet || !sheet.querySelector('#editProduct') || sheet.querySelector('#ichigoOnlineDetailPanel')) return;
        const product = findDetailProduct();
        if (!product || !product.sourceUrl) return;

        const actionRow = sheet.querySelector('#editProduct')?.closest('.button-row');
        if (!actionRow) return;
        actionRow.insertAdjacentHTML('beforebegin', onlineDetailHtml(product));

        const persisted = findDetailProduct() || product;
        const isStructured = persisted.onlineMatchStatus === 'structured' || persisted.sourceName === 'Open Beauty Facts';

        const originalFind = sheet.querySelector('#findOnline');
        const originalView = sheet.querySelector('#viewSource');
        if (originalFind && persisted.sourceUrl) originalFind.textContent = isStructured ? 'Find better match' : 'Find exact match';
        if (originalView && persisted.sourceUrl) originalView.textContent = 'View online';

        document.getElementById('ichigoOpenOnlineRef')?.addEventListener('click', () => window.open(persisted.sourceUrl, '_blank', 'noopener'));
        document.getElementById('ichigoViewStructuredSource')?.addEventListener('click', () => window.open(persisted.sourceUrl, '_blank', 'noopener'));
        document.getElementById('ichigoSearchWiderWeb')?.addEventListener('click', () => {
          const query = [persisted.brand, persisted.name].filter(Boolean).join(' ').trim() || persisted.name;
          window.open(webSearchUrl(query), '_blank', 'noopener');
        });
        document.getElementById('ichigoFindExactMatch')?.addEventListener('click', () => openExistingMatchPicker(persisted));
        document.getElementById('ichigoRefreshStructuredMatch')?.addEventListener('click', () => openExistingMatchPicker(persisted));
      }

      document.getElementById('bulkLinkDrawerBtn')?.addEventListener('click', startBulkLink);

      const mainObserver = new MutationObserver(() => {
        addBulkLinkButtonToStash();
        syncVisibleStashOnlineState();
      });
      const main = document.getElementById('main');
      if (main) mainObserver.observe(main, { childList: true, subtree: true });
      addBulkLinkButtonToStash();
      syncVisibleStashOnlineState();

      const sheet = document.getElementById('sheetContent');
      const sheetObserver = new MutationObserver(() => {
        queueMicrotask(decorateProductDetail);
      });
      if (sheet) sheetObserver.observe(sheet, { childList: true, subtree: true });

      document.addEventListener('click', event => {
        const oldFindButton = event.target.closest('#findOnline');
        if (!oldFindButton) return;
        const product = findDetailProduct();
        if (!product) return;
        event.preventDefault();
        event.stopPropagation();
        event.stopImmediatePropagation();
        openExistingMatchPicker(product);
      }, true);

      document.addEventListener('click', event => {
        const target = event.target.closest('[data-product-menu],[data-product]');
        if (!target) return;
        lastOpenedProductId = target.dataset.productMenu || target.dataset.product || '';
      }, true);

      document.addEventListener('click', async event => {
        const button = event.target.closest('#saveProduct');
        if (!button || bypassAutoLookup || button.disabled) return;

        const nameEl = document.querySelector('#fName');
        const sourceEl = document.querySelector('#fSourceUrl');
        const brandEl = document.querySelector('#fBrand');
        const name = nameEl?.value.trim() || '';
        const brand = brandEl?.value.trim() || '';

        if (!name || sourceEl?.value.trim() || !onlineEnabled()) return;

        event.preventDefault();
        event.stopPropagation();
        event.stopImmediatePropagation();

        const originalText = button.textContent;
        button.disabled = true;
        button.textContent = navigator.onLine ? 'Finding online…' : 'Connecting web search…';

        const query = [brand, name].filter(Boolean).join(' ').trim() || name;
        let sourceUrl = webSearchUrl(query);
        let best = null;

        if (navigator.onLine) {
          try {
            best = await findBestOnlineProduct(query, name, brand);
            if (best && best.score >= AUTO_MATCH_THRESHOLD) {
              sourceUrl = applyProductMatch(best) || sourceUrl;
            } else {
              best = null;
            }
          } catch (_) {
            best = null;
          }
        }

        if (sourceEl) sourceEl.value = sourceUrl;
        button.disabled = false;
        button.textContent = originalText;

        bypassAutoLookup = true;
        button.click();
        bypassAutoLookup = false;

        setTimeout(() => {
          const db = readData();
          if (!db) return;
          const saved = db.products
            .filter(product => norm(product.name) === norm(name))
            .sort((a, b) => Number(b.updatedAt || b.createdAt || 0) - Number(a.updatedAt || a.createdAt || 0))[0];
          if (!saved) return;

          if (best) enrichStoredProduct(saved, best);
          else if (!saved.sourceUrl) attachSearchFallback(saved);
          else {
            saved.sourceName = saved.sourceName || 'Web Search';
            saved.onlineMatchStatus = saved.onlineMatchStatus || 'search-link';
            saved.onlineLinkedAt = saved.onlineLinkedAt || Date.now();
          }
          writeData(db);
          syncVisibleStashOnlineState();
        }, 120);
      }, true);
    })();
  </script>
</body>
</html>
